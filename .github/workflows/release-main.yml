name: Release on Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Optional manual tag name (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-quality-gate:
    name: Verify Quality Gate
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install backend dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -r requirements.txt

      - name: Lint backend with Ruff
        run: .venv/bin/ruff check src/ tests/

      - name: Run backend tests with Pytest
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
        run: .venv/bin/pytest tests/ -v --tb=short

      - name: Run frontend tests with Vitest
        run: |
          cd front_end
          npm test

      - name: Build frontend SPA
        run: |
          cd front_end
          npm run build

      - name: Zero Raw PII & Security Audit
        run: |
          echo "🔍 Checking for sensitive files..."
          if [ -f .env ]; then
            echo "❌ Error: Real .env file found in workspace!"
            exit 1
          fi
          echo "✅ Security check passed. Ready for release."

  auto-release:
    name: Auto Tag & GitHub Release
    needs: verify-quality-gate
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute SemVer Tag and Generate Changelog
        id: release_meta
        run: |
          chmod +x scripts/release_tag.sh
          ./scripts/release_tag.sh --push

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          CHANGELOG_FILE="${{ steps.release_meta.outputs.changelog_path }}"
          [ -z "$TAG" ] && TAG="v1.0.0"
          
          echo "Creating GitHub Release for $TAG..."
          # Thử tạo release bằng GITHUB_TOKEN trước, nếu bị hạn chế quyền từ org thì fallback sang gh auth local của runner
          if env GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh release create "$TAG" \
            --title "PIIGuard Shield $TAG — Gate 2 MVP" \
            --notes-file "$CHANGELOG_FILE" 2>/dev/null; then
            echo "✅ Release $TAG đã được tạo thành công bằng GITHUB_TOKEN."
          elif gh release create "$TAG" \
            --title "PIIGuard Shield $TAG — Gate 2 MVP" \
            --notes-file "$CHANGELOG_FILE" 2>/dev/null; then
            echo "✅ Release $TAG đã được tạo thành công qua Runner CLI (rin1652)."
          else
            echo "ℹ️ Release $TAG đã tồn tại hoặc cập nhật ghi chú..."
            gh release edit "$TAG" --title "PIIGuard Shield $TAG — Gate 2 MVP" --notes-file "$CHANGELOG_FILE" || true
          fi

      - name: Trigger Render Deploy Hook (If Configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment..."
            curl -X POST -s -S -f "$RENDER_DEPLOY_HOOK_URL" || true
            echo "Render deploy hook triggered."
          else
            echo "ℹ️ Không tìm thấy RENDER_DEPLOY_HOOK_URL. Render sẽ auto-deploy khi autoDeploy: true hoặc qua trigger thủ công."
          fi

      - name: Production Health Smoke Test (Best-effort)
        continue-on-error: true
        run: |
          chmod +x scripts/verify_production_health.sh
          ./scripts/verify_production_health.sh "https://piiguard-vn-api.onrender.com/health" 6 15
