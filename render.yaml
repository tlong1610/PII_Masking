services:
  - type: web
    name: piiguard-vn-api
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_USERS
        value: "true"
      - key: APP_NAME
        value: PIIGuard Shield
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://frontend-alpha-fawn-53.vercel.app,http://localhost:5173,http://localhost:3000
      # App data and protected snapshots live in the Render Postgres below: the container disk is
      # wiped on every sleep/redeploy, and publishing needs a snapshot store the server can write.
      # Snapshots go to their own piiguard_snapshot_run{N} schemas, apart from the app tables.
      - key: DATABASE_URL
        fromDatabase:
          name: piiguard-vn-db
          property: connectionString
      - key: SNAPSHOT_DATABASE_URL
        fromDatabase:
          name: piiguard-vn-db
          property: connectionString
      - key: ENABLE_AI_SCAN
        value: "false"
      - key: ENABLE_PG_SNAPSHOT
        value: "false"
      - key: ENABLE_MONGO
        value: "false"
      - key: HMAC_SECRET
        generateValue: true
      - key: HMAC_KEY_VERSION
        value: v1

databases:
  - name: piiguard-vn-db
    plan: free
    databaseName: piiguard
    user: piiguard
